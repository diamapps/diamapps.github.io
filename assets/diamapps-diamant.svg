<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DiamApps – Diamant">
  <defs>
    <!-- Kronenflügel links: das hellste Feld, Licht von links oben -->
    <linearGradient id="kroneL" x1="0.15" y1="0.05" x2="0.85" y2="1">
      <stop offset="0" stop-color="#EDEFF1"/><stop offset="0.45" stop-color="#C2C8CE"/>
      <stop offset="1" stop-color="#878E95"/>
    </linearGradient>
    <!-- Kronenflügel rechts: eine Spur kühler und dunkler -->
    <linearGradient id="kroneR" x1="0.85" y1="0.05" x2="0.2" y2="1">
      <stop offset="0" stop-color="#DDE1E5"/><stop offset="0.5" stop-color="#A8AFB6"/>
      <stop offset="1" stop-color="#6E757C"/>
    </linearGradient>
    <!-- Der dunkle Keil zwischen den beiden Spitzen -->
    <linearGradient id="keil" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#23272B"/><stop offset="1" stop-color="#0C0E10"/>
    </linearGradient>
    <linearGradient id="pavLa" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#D2D8DE"/><stop offset="1" stop-color="#585F66"/>
    </linearGradient>
    <linearGradient id="pavLb" x1="0.3" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#6A7178"/><stop offset="1" stop-color="#16191C"/>
    </linearGradient>
    <linearGradient id="pavRb" x1="0.7" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#555C63"/><stop offset="1" stop-color="#111417"/>
    </linearGradient>
    <linearGradient id="pavRa" x1="0.8" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#AEB5BC"/><stop offset="1" stop-color="#3D4247"/>
    </linearGradient>
    <!-- Der warme Lichtstreif auf der Rundiste – das einzige warme Element -->
    <linearGradient id="streif" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A96A" stop-opacity="0"/>
      <stop offset="0.14" stop-color="#E0BC85" stop-opacity="0.55"/>
      <stop offset="0.32" stop-color="#FFE3AE"/>
      <stop offset="0.46" stop-color="#FFF8E8"/>
      <stop offset="0.50" stop-color="#FFFFFF"/>
      <stop offset="0.54" stop-color="#FFF8E8"/>
      <stop offset="0.68" stop-color="#FFE3AE"/>
      <stop offset="0.86" stop-color="#E0BC85" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C9A96A" stop-opacity="0"/>
    </linearGradient>
    <!-- Zweiter, engerer Verlauf nur für den heissen Kern in der Mitte -->
    <linearGradient id="kern" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.24" stop-color="#FFE9BC" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#FFF6DF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="0.58" stop-color="#FFF6DF" stop-opacity="0.9"/>
      <stop offset="0.76" stop-color="#FFE9BC" stop-opacity="0"/>
    </linearGradient>
    <filter id="glut" x="-60%" y="-900%" width="220%" height="1900%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Krone: zwei helle Flügel, dazwischen der dunkle Keil -->
  <path d="M86 232 L168 104 L256 196 L256 232 Z" fill="url(#kroneL)"/>
  <path d="M426 232 L344 104 L256 196 L256 232 Z" fill="url(#kroneR)"/>
  <path d="M168 104 L344 104 L256 196 Z" fill="url(#keil)"/>

  <!-- Pavillon: vier Facetten, zur Spitze hin dunkler -->
  <path d="M86 232 L196 232 L256 436 Z" fill="url(#pavLa)"/>
  <path d="M196 232 L256 232 L256 436 Z" fill="url(#pavLb)"/>
  <path d="M256 232 L316 232 L256 436 Z" fill="url(#pavRb)"/>
  <path d="M316 232 L426 232 L256 436 Z" fill="url(#pavRa)"/>

  <!-- Facettenkanten, sehr fein -->
  <g stroke="#E8EDF2" stroke-opacity="0.22" stroke-width="1.2" fill="none" stroke-linejoin="round">
    <path d="M86 232 L168 104 L256 196 L344 104 L426 232"/>
    <path d="M86 232 L256 436 L426 232"/>
    <path d="M196 232 L256 436 M316 232 L256 436 M256 232 L256 436"/>
  </g>

  <!-- Lichtstreif: weicher Schein plus scharfe Linie -->
  <rect x="26" y="222" width="460" height="20" fill="url(#streif)" filter="url(#glut)" opacity="0.75"/>
  <rect x="66" y="228" width="380" height="9" fill="url(#kern)" filter="url(#glut)" opacity="0.95"/>
  <rect x="86" y="230.2" width="340" height="3.6" fill="url(#streif)"/>
  <rect x="150" y="230.6" width="212" height="2.8" fill="url(#kern)"/>
</svg>
