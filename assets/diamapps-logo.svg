<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DiamLaps Logo – Diamant">
  <defs>
    <!-- Grundverlauf des Diamanten: eisblau oben, sattes Blau unten -->
    <linearGradient id="dlBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF5FF"/>
      <stop offset="0.45" stop-color="#8FC4FA"/>
      <stop offset="1" stop-color="#1E62D0"/>
    </linearGradient>
    <!-- Glanz-Schleier über der Krone (Liquid-Glass-Look) -->
    <linearGradient id="dlGloss" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Weicher Schatten unter dem Stein -->
    <radialGradient id="dlShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1E62D0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1E62D0" stop-opacity="0"/>
    </radialGradient>
    <!-- Innenleuchten -->
    <radialGradient id="dlGlow" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#BFE0FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#BFE0FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="dlBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- weicher Bodenschatten -->
  <ellipse cx="256" cy="452" rx="150" ry="26" fill="url(#dlShadow)"/>

  <!-- Diamant-Silhouette -->
  <polygon points="166,112 346,112 446,226 256,432 66,226" fill="url(#dlBase)"/>

  <!-- Kronen-Facetten -->
  <polygon points="66,226 166,112 161,226" fill="#5AA7F5" opacity="0.92"/>
  <polygon points="161,226 166,112 256,226" fill="#A7D2FC" opacity="0.9"/>
  <polygon points="166,112 346,112 256,226" fill="#DFF0FF" opacity="0.95"/>
  <polygon points="346,112 351,226 256,226" fill="#8FC0F8" opacity="0.9"/>
  <polygon points="346,112 446,226 351,226" fill="#3D86E8" opacity="0.92"/>

  <!-- Pavillon-Facetten -->
  <polygon points="66,226 161,226 256,432" fill="#2F7FE0" opacity="0.95"/>
  <polygon points="161,226 256,226 256,432" fill="#77B5F8" opacity="0.9"/>
  <polygon points="256,226 351,226 256,432" fill="#3F8FEA" opacity="0.9"/>
  <polygon points="351,226 446,226 256,432" fill="#1B57BE" opacity="0.95"/>

  <!-- feine Facettenkanten in Weiß -->
  <g stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2.5" stroke-linejoin="round" fill="none">
    <polygon points="166,112 346,112 446,226 256,432 66,226"/>
    <line x1="66" y1="226" x2="446" y2="226"/>
    <line x1="166" y1="112" x2="161" y2="226"/>
    <line x1="166" y1="112" x2="256" y2="226"/>
    <line x1="346" y1="112" x2="256" y2="226"/>
    <line x1="346" y1="112" x2="351" y2="226"/>
    <line x1="161" y1="226" x2="256" y2="432"/>
    <line x1="256" y1="226" x2="256" y2="432"/>
    <line x1="351" y1="226" x2="256" y2="432"/>
  </g>

  <!-- Innenleuchten + Glanz-Schleier -->
  <polygon points="166,112 346,112 446,226 256,432 66,226" fill="url(#dlGlow)"/>
  <polygon points="166,112 346,112 446,226 66,226" fill="url(#dlGloss)" opacity="0.8"/>

  <!-- flüssiger Lichtreflex auf der Tafel -->
  <ellipse cx="232" cy="140" rx="86" ry="18" fill="#FFFFFF" opacity="0.75" filter="url(#dlBlur)" transform="rotate(-6 232 140)"/>

  <!-- Funkeln -->
  <g fill="#FFFFFF">
    <path d="M118 96 l7 20 20 7 -20 7 -7 20 -7 -20 -20 -7 20 -7 z" opacity="0.95"/>
    <path d="M404 300 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5 z" opacity="0.9"/>
    <path d="M330 64 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z" opacity="0.85"/>
  </g>
</svg>
